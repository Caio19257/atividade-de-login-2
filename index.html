<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SistemaWeb</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #dfe3e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            min-height: 600px;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .lado-esquerdo {
            flex: 1;
            background: linear-gradient(145deg, #0d47a1, #1976d2 60%, #42a5f5);
            color: #ffffff;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #90caf9;
        }

        .lado-esquerdo h2 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .lado-esquerdo p.sub {
            color: #bbdefb;
            line-height: 1.5;
            max-width: 340px;
        }

        .destaque {
            border-left: 4px solid #90caf9;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 20px;
        }

        .destaque h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .destaque p {
            color: #e3f2fd;
            line-height: 1.5;
        }

        .lado-direito {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lado-direito h1 {
            color: #3aaee8;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #2196c9;
            font-size: 14px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .campo {
            margin-bottom: 22px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border: 1px solid #d5dbe3;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #90caf9;
            box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.15);
        }

        input::placeholder {
            color: #a0aab5;
        }

        .opcoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .lembrar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a5568;
        }

        .lembrar input {
            width: 16px;
            height: 16px;
        }

        .opcoes a {
            color: #1565c0;
            font-weight: bold;
            text-decoration: none;
        }

        .opcoes a:hover,
        .criar-conta a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .criar-conta {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .criar-conta a {
            color: #2196c9;
            text-decoration: none;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }

            .lado-esquerdo {
                padding: 35px 30px;
                gap: 25px;
            }

            .lado-esquerdo h2 {
                font-size: 36px;
            }

            .lado-direito {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <section class="lado-esquerdo">
            <div class="logo">SISTEMA<span>WEB</span></div>

            <div>
                <h2>Bem-vindo!</h2>
                <p class="sub">Acesse sua conta para continuar usando todos os recursos do sistema.</p>
            </div>

            <div class="destaque">
                <h3>Gestão simples e eficiente</h3>
                <p>Tenha acesso às suas informações de forma rápida, segura e organizada.</p>
            </div>
        </section>

        <section class="lado-direito">
            <h1>Entrar na sua conta</h1>
            <p class="subtitulo">Informe seus dados para acessar o sistema.</p>

            <form action="#" method="post">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="opcoes">
                    <label class="lembrar" style="font-weight: normal; margin: 0;">
                        <input type="checkbox" name="lembrar"> Lembrar de mim
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>

                    <a href="3 index.html" class="login"><button type="button">Entrar</button></a>
            </form>

            <a href="2 index.html"><button type="button" style="background: none; color: #2196c9; font-size: 14px; font-weight: normal; margin-top: 25px;">Ainda não possui uma conta?</button></a>
        </section>

    </div>
</body>
</html>
